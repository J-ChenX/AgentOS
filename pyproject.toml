[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "可复用 AI Agent 框架 — 在任意目录拉起智能体"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",
    "tomlkit>=0.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "litellm>=1.83.7",
    "packaging>=23.0",
    "Pillow>=10.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.27.0",
    "build>=1.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
agentos = "agentos.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]
artifacts = ["src/agentos/_web_assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"
